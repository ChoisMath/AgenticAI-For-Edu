name: Build and Release Skill ZIPs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build per-chapter / per-skill ZIPs
        run: |
          set -euo pipefail
          mkdir -p dist
          WORK="$GITHUB_WORKSPACE"

          if [ ! -d "chapters" ]; then
            echo "ERROR: chapters/ directory not found"
            exit 1
          fi

          shopt -s nullglob
          chapter_count=0

          for chapter_dir in chapters/*/; do
            chapter=$(basename "$chapter_dir")           # e.g. "5장"
            skills_dir="${chapter_dir}skills"

            if [ ! -d "$skills_dir" ]; then
              echo "Skip $chapter — no skills/ directory"
              continue
            fi

            # Extract leading integer for an ASCII-safe ZIP prefix.
            # GitHub Release API strips non-ASCII chars from asset names,
            # so "5장-foo.zip" would arrive as "5.-foo.zip".
            num=$(echo "$chapter" | grep -oE '^[0-9]+' || true)
            if [ -z "$num" ]; then
              echo "WARN: $chapter has no leading number, skipping"
              continue
            fi
            prefix=$(printf "ch%02d" "$num")             # "ch05"

            chapter_count=$((chapter_count + 1))
            echo "=== Processing chapter: $chapter (prefix=$prefix) ==="

            # Per-skill ZIPs (zip from skills/ so the archive root is the skill folder)
            skill_count=0
            for skill_dir in "$skills_dir"/*/; do
              skill=$(basename "$skill_dir")
              skill_count=$((skill_count + 1))
              echo "  -> ${prefix}-${skill}.zip"
              (cd "$skills_dir" && zip -rq "$WORK/dist/${prefix}-${skill}.zip" "$skill" \
                -x "*.DS_Store" "*/__pycache__/*" "*.pyc")
            done

            if [ "$skill_count" -gt 0 ]; then
              echo "  -> ${prefix}-all-skills.zip ($skill_count skills)"
              (cd "$skills_dir" && zip -rq "$WORK/dist/${prefix}-all-skills.zip" . \
                -x "*.DS_Store" "*/__pycache__/*" "*.pyc")
            fi
          done

          if [ "$chapter_count" -eq 0 ]; then
            echo "ERROR: no chapter folders with skills/ found"
            exit 1
          fi

          echo "=== Building all-chapters bundle ==="
          zip -rq "dist/all-chapters.zip" chapters README.md LICENSE \
            -x "*.DS_Store" "*/__pycache__/*" "*.pyc"

          echo
          echo "Built artifacts:"
          ls -lh dist

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
