name: Build and Release Skill ZIPs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build per-skill ZIPs
        run: |
          set -euo pipefail
          mkdir -p dist

          SKILLS=(
            "reading-material"
            "activity-sheet"
            "interactive-visualizer"
            "case-based-problem"
            "material-validator"
          )

          for skill in "${SKILLS[@]}"; do
            if [ -d "$skill" ]; then
              echo "Packing $skill ..."
              zip -r "dist/${skill}.zip" "$skill" \
                -x "*.DS_Store" "*/__pycache__/*" "*.pyc"
            else
              echo "WARN: $skill folder not found, skipping"
            fi
          done

          echo "Packing all-in-one bundle ..."
          zip -r "dist/claude-skills-for-teachers-all.zip" \
            "${SKILLS[@]}" README.md LICENSE \
            -x "*.DS_Store" "*/__pycache__/*" "*.pyc"

          ls -lh dist

      - name: Upload artifacts (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
